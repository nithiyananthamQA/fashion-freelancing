# Push to main -> the live site updates.
#
# Before this can run, one secret must exist in
# GitHub → Settings → Secrets and variables → Actions:
#
#   CLOUDFLARE_API_TOKEN   Cloudflare dashboard → My Profile → API Tokens
#                          → Create Token → "Edit Cloudflare Workers"
#                          (it also needs D1 edit permission)
#
# Without it the job fails loudly rather than deploying a half-configured site.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:      # lets you deploy by hand from the Actions tab

concurrency:
  # A newer push supersedes an in-flight deploy; never race two of them.
  group: deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: fashion-os/package-lock.json

      - name: Install
        working-directory: fashion-os
        run: npm ci

      # Typecheck before deploying — a broken build should never reach the site.
      - name: Check
        working-directory: fashion-os
        run: npm run check

      - name: Build
        working-directory: fashion-os
        run: npm run build

      # Apply any new migrations before the code that depends on them goes live.
      - name: Migrate database
        working-directory: fashion-os
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler d1 migrations apply fashion_os --remote

      - name: Deploy
        working-directory: fashion-os
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy --config dist/server/wrangler.json
