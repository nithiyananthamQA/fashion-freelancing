<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Join free · Fashion Freelancing</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media=&apos;all&apos;" />
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" /></noscript>
<link rel="stylesheet" href="../assets/styles.css" />
<style>
  .role-card { border:1px solid var(--line); border-radius:12px; padding:18px; cursor:pointer; transition: all .15s; }
  .role-card:hover { border-color: var(--ink); }
  .role-card input { display:none; }
  .role-card:has(input:checked) { border-color: var(--ink); background: var(--paper); box-shadow: inset 0 0 0 1px var(--ink); }
  .oauth { display:flex; align-items:center; justify-content:center; gap:10px; border:1px solid var(--line); background:var(--paper-2); padding:11px; border-radius:10px; font-size:14px; font-weight:500; transition: all .15s; }
  .oauth:hover { border-color:var(--ink); background: var(--paper); }
  .or-divider { display:flex; align-items:center; gap:12px; color: var(--ink-5); font-size:12px; margin: 18px 0; }
  .or-divider::before, .or-divider::after { content:""; flex:1; height:1px; background: var(--line); }
  /* Desktop: slightly wider image side */
  @media (min-width: 1024px) { .auth-split { grid-template-columns: 1.05fr 1fr; } }
  /* Mobile: stack role cards and oauth buttons */
  @media (max-width: 480px) {
    .auth-pane { padding: 24px 20px; }
    .role-col2, .oauth-col2, .name-col2 { grid-template-columns: 1fr !important; }
  }
</style>
</head>
<body>

<div class="auth-split">
  <div class="auth-side">
    <img src="https://images.unsplash.com/photo-1539109136881-3be0616acf4b?w=1400&auto=format&fit=crop" alt=""/>
    <div style="position:absolute;inset:0;background:linear-gradient(135deg,rgba(0,0,0,.55),transparent 60%);"></div>
    <div style="position:absolute;top:32px;left:32px;">
      <a href="../index.html" class="logo" aria-label="Fashion Freelancing home" style="text-decoration:none; display:flex; align-items:center; gap:10px;">
        <svg width="30" height="30" viewBox="0 0 32 32" aria-hidden="true">
          <defs>
            <linearGradient id="ffLogoGradSignup1" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#6E56F0"/>
              <stop offset="0.25" stop-color="#2BA8E8"/>
              <stop offset="0.5" stop-color="#00C853"/>
              <stop offset="0.75" stop-color="#F0A93B"/>
              <stop offset="1" stop-color="#FF0055"/>
            </linearGradient>
          </defs>
          <rect width="32" height="32" rx="9" fill="url(#ffLogoGradSignup1)"/>
          <path d="M10 23V9h12M10 16h9" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
          <circle cx="23" cy="23" r="2.4" fill="#FFFFFF"/>
        </svg>
        <div style="font-family:var(--font-display);font-size:18px;font-weight:700;color:#FFF;">Fashion<span style="color:#FFF;opacity:0.8;">Freelancing</span></div>
      </a>
    </div>
    <div style="position:absolute;bottom:32px;left:32px;right:32px;color:#fff;">
      <div style="font-family:var(--font-display);font-size:38px;font-weight:480;line-height:1.1;max-width:480px;letter-spacing:-0.025em;">Join 12,400 fashion freelancers and 800+ brands.</div>
      <div style="display:flex;align-items:center;gap:10px;margin-top:24px;">
        <div style="display:flex;">
          <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=80" class="avatar" style="width:32px;height:32px;border:2px solid #fff;"/>
          <img src="https://images.unsplash.com/photo-1502823403499-6ccfcf4fb453?w=80" class="avatar" style="width:32px;height:32px;border:2px solid #fff;margin-left:-8px;"/>
          <img src="https://images.unsplash.com/photo-1544005313-94ddf0286df2?w=80" class="avatar" style="width:32px;height:32px;border:2px solid #fff;margin-left:-8px;"/>
        </div>
        <div style="font-size:13px;opacity:.85;">In Tokyo, Milan, Mexico City, Paris &amp; 82 more places.</div>
      </div>
    </div>
  </div>

  <div class="auth-pane">
    <a href="../index.html" class="logo" style="opacity: 0; pointer-events: none;"><div style="font-family:var(--font-display);font-size:18px;font-weight:700;">FashionFreelancing</div></a>

    <div style="flex:1;display:flex;align-items:center;">
      <div style="width:100%;max-width:440px;margin:0 auto;">
        <h1 class="h-1" style="font-size: 38px;">Create your account.</h1>
        <p class="lead mt-3">First — what brings you here?</p>

        <form id="ff-signup-form" style="margin-top:24px;display:flex;flex-direction:column;gap:14px;">
          <div class="role-col2" style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
            <label class="role-card">
              <input type="radio" name="role" value="brand" checked/>
              <div>
                <div style="display:flex;align-items:center;gap:10px;">
                  <span style="width:32px;height:32px;border-radius:8px;background:var(--paper-2);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M3 21h18M5 21V7l7-4 7 4v14"/></svg>
                  </span>
                  <span style="font-weight:600;">I want to hire</span>
                </div>
                <p class="muted text-sm" style="margin: 8px 0 0;">I'm a fashion brand or designer who needs help.</p>
              </div>
            </label>
            <label class="role-card">
              <input type="radio" name="role" value="creator"/>
              <div>
                <div style="display:flex;align-items:center;gap:10px;">
                  <span style="width:32px;height:32px;border-radius:8px;background:var(--paper-2);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-7 8-7s8 3 8 7"/></svg>
                  </span>
                  <span style="font-weight:600;">I want to get hired</span>
                </div>
                <p class="muted text-sm" style="margin: 8px 0 0;">I'm a freelancer who wants to work in fashion.</p>
              </div>
            </label>
          </div>

          <div class="oauth-col2" style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
            <button type="button" id="oauth-google" class="oauth">
              <svg width="16" height="16" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.6 12.2c0-.7-.1-1.4-.2-2H12v3.9h6c-.3 1.4-1.1 2.5-2.3 3.3v2.7h3.7c2.2-2 3.4-5 3.4-7.9z"/><path fill="#34A853" d="M12 23c3.1 0 5.7-1 7.6-2.8l-3.7-2.8c-1 .7-2.4 1.1-3.9 1.1-3 0-5.5-2-6.4-4.7H1.7v3C3.6 20.6 7.5 23 12 23z"/><path fill="#FBBC05" d="M5.6 13.7c-.2-.7-.4-1.4-.4-2.2s.1-1.5.4-2.2v-3H1.7C.9 7.9.5 9.4.5 11s.4 3.1 1.2 4.7l3.9-3z"/><path fill="#EA4335" d="M12 4.7c1.7 0 3.2.6 4.4 1.7l3.3-3.3C17.7 1.3 15.1.5 12 .5 7.5.5 3.6 2.9 1.7 6.5l3.9 3C6.5 6.7 9 4.7 12 4.7z"/></svg>
              Continue with Google
            </button>
            <button type="button" id="oauth-apple" class="oauth">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M17.5 12.5c0-2.6 2.1-3.9 2.2-4-1.2-1.7-3-2-3.7-2-1.6-.2-3 .9-3.8.9-.8 0-2-.9-3.3-.9-1.7 0-3.3 1-4.2 2.5-1.8 3.1-.5 7.7 1.3 10.2.9 1.2 1.9 2.6 3.2 2.6 1.3-.1 1.8-.8 3.3-.8s2 .8 3.3.8c1.4 0 2.3-1.3 3.1-2.5.6-.9 1.2-1.9 1.6-3-1.7-.7-2.9-2.4-3-4.4zM14.7 4.6c.7-.8 1.1-2 1-3.1-.9 0-2 .6-2.7 1.4-.6.7-1.2 1.9-1 3 1 .1 2-.5 2.7-1.3z"/></svg>
              Continue with Apple
            </button>
          </div>

          <div class="or-divider">or use your email</div>

          <div class="name-col2" style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
            <div><label class="label">First name</label><input class="input" name="firstName" type="text" placeholder="Yuna" required/></div>
            <div><label class="label">Last name</label><input class="input" name="lastName" type="text" placeholder="Aoki" required/></div>
          </div>
          <div><label class="label">Email</label><input class="input" name="email" type="email" placeholder="you@email.com" required/></div>
          <div><label class="label">Password</label><input class="input" name="password" type="password" placeholder="At least 8 characters" required minlength="8"/></div>

          <label style="display:flex;align-items:flex-start;gap:8px;font-size:13px;color:var(--ink-3);cursor:pointer;">
            <input type="checkbox" required style="accent-color:var(--ink);margin-top:2px;"/>
            <span>I agree to the <a href="./terms.html" class="ulink" style="color:var(--ink);">Terms</a> and <a href="./privacy.html" class="ulink" style="color:var(--ink);">Privacy Policy</a>.</span>
          </label>

          <button class="btn btn-primary btn-lg w-full" type="submit">Create my account →</button>
        </form>

        <p class="text-sm muted text-center mt-6">
          Already have an account? <a href="./login.html" class="ulink" style="color:var(--ink);">Sign in →</a>
        </p>
      </div>
    </div>

    <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--ink-5);">
      <span>© 2026 Fashion Freelancing</span>
      <div style="display:flex;gap:16px;"><a href="./privacy.html">Privacy</a><a href="./terms.html">Terms</a></div>
    </div>
  </div>
</div>

<script src="../assets/site.js"></script>
<script>
  window.onFFReady(() => {
    const form = document.getElementById('ff-signup-form');
    if (!form) return;
    const submitBtn = form.querySelector('button[type="submit"]');

    // Pre-select role from URL: signup.html?role=creator  or  ?role=brand
    const urlRole = new URLSearchParams(location.search).get('role');
    if (urlRole === 'creator' || urlRole === 'brand') {
      const radio = form.querySelector(`input[name="role"][value="${urlRole}"]`);
      if (radio) radio.checked = true;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      // Select by name — robust against DOM order changes
      const role      = form.querySelector('input[name="role"]:checked')?.value || 'creator';
      const firstName = (form.querySelector('input[name="firstName"]')?.value || '').trim();
      const lastName  = (form.querySelector('input[name="lastName"]')?.value || '').trim();
      const email     = (form.querySelector('input[name="email"]')?.value || '').trim();
      const password  = form.querySelector('input[name="password"]')?.value || '';
      const name = (firstName + ' ' + lastName).trim() || email.split('@')[0];

      if (!email) { UI.toast('Please enter your email.', { kind: 'warn' }); return; }
      if (!password || password.length < 8) { UI.toast('Password must be at least 8 characters.', { kind: 'warn' }); return; }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Creating account…';
      try {
        await api.users.signUp({ email, password, name, role });
        await api.users.signIn({ email, password, role });
        UI.toast(role === 'creator' ? 'Welcome! Let’s set up your freelancer page.' : 'Welcome! Let’s get you set up.', { kind: 'success' });
        setTimeout(() => { window.location = './onboarding.html'; }, 600);
      } catch (err) {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Create my account →';
        UI.toast(err.message || 'Could not create account', { kind: 'error' });
      }
    });

    // OAuth buttons — create a demo account in the chosen role
    function oauthSignup(provider) {
      const role = form.querySelector('input[name="role"]:checked')?.value || 'creator';
      const email = `${provider}.user.${Date.now()}@example.com`;
      api.users.signUp({ email, password: 'oauth-demo-pass', name: `${provider[0].toUpperCase()}${provider.slice(1)} User`, role })
        .then(() => api.users.signIn({ email, role }))
        .then(() => {
          UI.toast('Account created — welcome!', { kind: 'success' });
          setTimeout(() => { window.location = './onboarding.html'; }, 600);
        })
        .catch(err => UI.toast(err.message || 'Could not sign up', { kind: 'error' }));
    }
    document.getElementById('oauth-google')?.addEventListener('click', () => oauthSignup('google'));
    document.getElementById('oauth-apple')?.addEventListener('click', () => oauthSignup('apple'));
  });
</script>

</body>
</html>
