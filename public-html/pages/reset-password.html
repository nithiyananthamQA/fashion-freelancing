<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Set new password · Fashion Freelancing</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media=&apos;all&apos;" />
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" /></noscript>
<link rel="stylesheet" href="../assets/styles.css" />
</head>
<body>

<div class="auth-split">
  <div class="auth-pane">
    <a href="../index.html" class="logo"><span class="logo-mark">F</span><span class="logo-text">Fashion<span>Freelancing</span></span></a>
    <div style="flex:1;display:flex;align-items:center;">
      <div style="width:100%;max-width:400px;margin:0 auto;">
        <h1 class="h-1" style="font-size: 38px;">Set a new password.</h1>
        <p class="lead mt-3">Pick something you'll remember — at least 8 characters, mix of letters and numbers.</p>

        <form style="margin-top:28px;display:flex;flex-direction:column;gap:14px;" onsubmit="window.location='./login.html';return false;">
          <div><label class="label">New password</label><input class="input" type="password" required minlength="8"/></div>
          <div><label class="label">Confirm password</label><input class="input" type="password" required minlength="8"/></div>

          <div style="display:flex;gap:8px;align-items:center;font-size:12px;color:var(--ink-5);">
            <span style="height:4px;flex:1;background:var(--paper-2);border-radius:99px;overflow:hidden;"><span style="display:block;height:100%;width:60%;background:linear-gradient(90deg,var(--champagne),var(--champagne-2));"></span></span>
            <span>Strong</span>
          </div>

          <button class="btn btn-primary btn-lg w-full" type="submit">Reset password →</button>
        </form>
      </div>
    </div>
    <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--ink-5);"><span>© 2026 Fashion Freelancing</span><a href="./login.html" class="ulink">Back to sign in</a></div>
  </div>

  <div class="auth-side">
    <img src="https://images.unsplash.com/photo-1469334031218-e382a71b716b?w=1400&auto=format&fit=crop" alt=""/>
    <div style="position:absolute;inset:0;background:linear-gradient(135deg,rgba(0,0,0,.5),transparent 60%);"></div>
  </div>
</div>

<script src="../assets/site.js"></script>
</body>
</html>
