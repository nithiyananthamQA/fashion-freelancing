<!doctype html>
<html lang="en">
<head>
<script>/* theme: applied before first paint to avoid a flash of the wrong one */
(function(){var d=document.documentElement;
try{var t=localStorage.getItem('ff-theme');if(t==='light'||t==='dark')d.setAttribute('data-theme',t); }catch(e){}
/* Only allow the scroll-reveal to hide anything once we know script is running
   and the browser can observe it. Without this the page ships 30-60 elements at
   opacity:0 and a single script hiccup leaves half the page permanently blank. */
if('IntersectionObserver' in window)d.className+=' rv-on'; })();</script>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Something went wrong · Fashion Freelancing</title>
<meta name="robots" content="noindex" />
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<!-- fonts are self-hosted and preloaded, so they usually land before first
     paint; the metric-matched fallbacks cover the rest without layout shift -->
<link rel="preload" href="/assets/fonts/pjs-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/assets/fonts/instrument-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../assets/styles.css" />
<link rel="stylesheet" href="../assets/night.css" />
<link rel="stylesheet" href="../assets/network.css" />
<link rel="stylesheet" href="../assets/mobile.css">
</head>
<body>

<div id="site-nav"></div>

<section style="min-height: 70vh; display: flex; align-items: center;">
  <div class="container" style="max-width: 720px; text-align: center;">
    <div style="font-family: var(--font-display); font-size: clamp(120px, 18vw, 220px); line-height: 1; font-weight: 300; letter-spacing: -0.06em; color: var(--ink-7); font-variation-settings: 'SOFT' 100;">500</div>
    <h1 class="h-1 mt-4">Something went <span class="display-italic" style="color:var(--ink-3);">wrong on our end</span>.</h1>
    <p class="lead mt-4">A glitch in the loom. Try again in a minute — and if it keeps happening, tell us and we'll fix it.</p>
    <div class="mt-8" style="display:flex; gap:12px; justify-content:center; flex-wrap:wrap;">
      <button onclick="location.reload()" class="btn btn-primary">↻ Try again</button>
      <a href="/" class="btn btn-ghost">← Home</a>
      <a href="/pages/help" class="btn btn-ghost">Contact support</a>
    </div>
  </div>
</section>

<div id="site-footer"></div>
<script src="../assets/site.js"></script>
</body>
</html>
