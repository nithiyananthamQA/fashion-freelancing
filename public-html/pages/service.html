<!--
  SEO BOOTSTRAP — runs synchronously in <head> so title, description,
  canonical, Open Graph, Twitter Card, JSON-LD, and hero preload are
  all set before Lighthouse or any crawler evaluates the page.
-->
<script>
(function () {
  var slug = new URLSearchParams(location.search).get('svc') || '';
  var SEO = {
    'tech-pack':           { t: 'Tech Pack',               d: 'Complete specification documents built for real production pipelines. Every measurement, trim, and construction detail factory-ready.' },
    '3d-virtual-sampling': { t: '3D Virtual Sampling',     d: 'Photorealistic 3D samples that reduce physical sampling rounds. Review fit, colorways, and fabric fall before a single stitch is cut.' },
    'seamless-pattern':    { t: 'Seamless Pattern',        d: 'Digital repeat patterns ready for print, weave, or transfer production. Zero-break repeat tiling across all colorways.' },
    'pattern-cad':         { t: 'Pattern CAD',             d: 'CAD-built garment patterns ready for sampling, grading, and marker making. Lectra, Gerber, and Optitex formats.' },
    'dobby-jacquard':      { t: 'Dobby & Jacquard',       d: 'Custom dobby and jacquard designs developed for high-end textile production. Loom-verified specs for fashion and furnishings.' },
    'ai-content':          { t: 'AI Content Production',   d: 'Campaign-quality AI-generated fashion photography and lifestyle visuals at brand scale. No studio, no models, no delays.' },
    'product-photo-video': { t: 'Product Photo & Video',  d: 'Clean product photography and short-form video built for digital commerce. Formatted for Shopify, Amazon, Instagram, and paid ads.' },
    'ecom-listing':        { t: 'E-Commerce Listing',      d: 'Fully written product listings for Shopify, Amazon, and fashion marketplaces. SEO-optimised titles, descriptions, and specs.' },
    'website':             { t: 'Website',                 d: 'Custom fashion brand websites designed for conversion and credibility. Built in Webflow, Shopify, or custom code.' },
    'ai-agent':            { t: 'AI Agent',                d: 'Custom AI agents for customer service, lead capture, and business automation. Trained on your products, policies, and brand voice.' },
    'graphic-design':      { t: 'Graphic Design',          d: 'Brand-aligned graphic design for digital, print, and marketing. Consistent visual identity across every touchpoint.' },
  };
  var s = SEO[slug];
  if (!s) return;

  var baseUrl = location.origin + location.pathname + '?svc=' + slug;
  var heroImg = 'https://picsum.photos/seed/' + slug + '-hero/1200/630';

  /* Title + description */
  document.title = s.t + ' - Fashion Freelancing';
  document.querySelector('meta[name="description"]').content = s.d;

  /* Canonical */
  var can = document.createElement('link');
  can.rel = 'canonical'; can.href = baseUrl;
  document.head.appendChild(can);

  /* Open Graph */
  [
    ['property', 'og:type',        'website'],
    ['property', 'og:url',         baseUrl],
    ['property', 'og:title',       s.t + ' - Fashion Freelancing'],
    ['property', 'og:description', s.d],
    ['property', 'og:image',       heroImg],
    ['property', 'og:site_name',   'Fashion Freelancing'],
    ['name',     'twitter:card',   'summary_large_image'],
    ['name',     'twitter:title',  s.t + ' - Fashion Freelancing'],
    ['name',     'twitter:description', s.d],
    ['name',     'twitter:image',  heroImg],
  ].forEach(function (row) {
    var m = document.createElement('meta');
    m.setAttribute(row[0], row[1]); m.content = row[2];
    document.head.appendChild(m);
  });

  /* JSON-LD Service schema */
  var ld = document.createElement('script');
  ld.type = 'application/ld+json';
  ld.textContent = JSON.stringify({
    '@context': 'https://schema.org',
    '@type': 'Service',
    'name': s.t,
    'description': s.d,
    'url': baseUrl,
    'provider': {
      '@type': 'Organization',
      'name': 'Fashion Freelancing',
      'url': location.origin
    }
  });
  document.head.appendChild(ld);

  /* Preload LCP hero image */
  var pre = document.createElement('link');
  pre.rel = 'preload'; pre.as = 'image';
  pre.href = 'https://picsum.photos/seed/' + slug + '-hero/1600/900';
  document.head.appendChild(pre);
})();
</script>

<style>
/* ============================================================
   DESIGN TOKENS
   ============================================================ */
:root {
  --u: 8px;
  --paper:   #1C1D20;
  --paper-2: #25272B;
  --paper-3: #2E3035;
  --ink:     #EAE7DD;
  --ink-3:   rgba(234,231,221,.78);
  --ink-5:   rgba(234,231,221,.62);   /* raised from .50 → passes WCAG AA */
  --ink-7:   rgba(234,231,221,.38);
  --clay:    #FF5C1F;
  --hair:    rgba(234,231,221,.10);
  --hair-2:  rgba(234,231,221,.07);
  --mono:    'IBM Plex Mono', monospace;
  --sans:    'Inter', sans-serif;
  --nav-h:   56px;
}
:root[data-theme="light"] {
  --paper:   #E9E8E3;
  --paper-2: #DDDBD4;
  --paper-3: #D2D0C9;
  --ink:     #1C1D20;
  --ink-3:   rgba(28,29,32,.80);
  --ink-5:   rgba(28,29,32,.68);     /* raised from .55 → passes WCAG AA */
  --ink-7:   rgba(28,29,32,.42);
  --hair:    rgba(28,29,32,.12);
  --hair-2:  rgba(28,29,32,.08);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: var(--sans); background: var(--paper); color: var(--ink); -webkit-font-smoothing: antialiased; }
a { color: inherit; text-decoration: none; }
ul { list-style: none; }
img { display: block; }

/* ============================================================
   SKIP LINK — accessibility: lets keyboard users skip nav
   ============================================================ */
.skip-link {
  position: fixed; top: -100px; left: 20px; z-index: 10001;
  background: var(--clay); color: #fff;
  padding: 12px 20px;
  font-family: var(--mono); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase;
  border: 2px solid #fff;
  transition: top .2s ease;
  white-space: nowrap;
}
.skip-link:focus { top: 20px; }

/* ============================================================
   LAYOUT
   ============================================================ */
.wrap { max-width: 1560px; margin: 0 auto; padding: 0 30px; }
@media (max-width: 720px) { .wrap { padding: 0 20px; } }

/* ============================================================
   NAV / FOOTER OVERRIDES
   ============================================================ */
.topnav, .topnav.is-scrolled { background: var(--paper) !important; backdrop-filter: none !important; border-bottom: 1px solid var(--clay) !important; box-shadow: none !important; }
.topnav-inner { height: 56px !important; }
.topnav .logo svg { display: none !important; }
.topnav .logo-text { font-family: var(--mono) !important; font-size: 11px !important; font-weight: 500 !important; letter-spacing: 0.22em !important; text-transform: uppercase !important; color: var(--ink) !important; }
.topnav .logo-text span { background: none !important; -webkit-background-clip: unset !important; background-clip: unset !important; color: var(--clay) !important; font-weight: 500 !important; margin-left: 0 !important; }
.topnav-search { display: none !important; }
.topnav-links { flex: 1 !important; justify-content: center !important; gap: 32px !important; }
.topnav-links a { font-family: var(--mono) !important; font-size: 10px !important; letter-spacing: 0.18em !important; text-transform: uppercase !important; color: var(--ink-5) !important; font-weight: 400 !important; }
.topnav-links a:hover { color: var(--ink) !important; }
.topnav-links a.active { color: var(--clay) !important; }
.topnav-links a.active::after { display: none !important; }
.topnav-signin { font-family: var(--mono) !important; font-size: 10px !important; letter-spacing: 0.18em !important; text-transform: uppercase !important; color: var(--ink-5) !important; }
.topnav-signin:hover { color: var(--ink) !important; }
.topnav .btn, .topnav .btn-primary, .topnav .btn-sm { background: var(--clay) !important; color: var(--paper) !important; border: 1px solid var(--clay) !important; border-radius: 0 !important; box-shadow: none !important; font-family: var(--mono) !important; font-size: 10px !important; letter-spacing: 0.18em !important; text-transform: uppercase !important; padding: 9px 18px !important; }
.topnav .btn:hover, .topnav .btn-primary:hover { background: transparent !important; color: var(--clay) !important; }
/* Mobile hamburger — dark theme */
.topnav-burger { background: var(--paper-2) !important; border-color: var(--hair) !important; border-radius: 0 !important; backdrop-filter: none !important; -webkit-backdrop-filter: none !important; box-shadow: none !important; }
.topnav-burger:hover, .topnav-burger.is-open { border-color: var(--clay) !important; box-shadow: none !important; transform: none !important; }
.topnav-burger span { background: var(--ink) !important; }
/* Mobile slide-out menu */
.topnav-mobile { background: var(--paper-2) !important; top: var(--nav-h) !important; border-top: 1px solid var(--clay) !important; border-bottom: 1px solid var(--hair) !important; }
.topnav.is-scrolled .topnav-mobile { top: var(--nav-h) !important; }
.topnav-mobile-inner { background: var(--paper-2) !important; }
.topnav-mobile::before { display: none !important; }
.topnav-mobile-links a { font-family: var(--mono) !important; font-size: 10px !important; letter-spacing: 0.18em !important; text-transform: uppercase !important; color: var(--ink-5) !important; border-color: var(--hair) !important; border-radius: 0 !important; background: transparent !important; }
.topnav-mobile-links a:hover { color: var(--clay) !important; background: var(--paper-3) !important; }
.topnav-mobile-cta { border-color: var(--hair) !important; }
.footer, #site-footer, #site-footer * { background-color: transparent !important; }
#site-footer { background: var(--paper-2) !important; border-top: 1px solid var(--hair) !important; padding-top: 48px; padding-bottom: 32px; }
#site-footer a { color: var(--ink-3) !important; }
#site-footer a:hover { color: var(--clay) !important; }
#site-footer .h-3, #site-footer h3, #site-footer h4 { color: var(--ink) !important; }
#site-footer hr, #site-footer .line { border-color: var(--hair) !important; }
#site-footer .text-xs, #site-footer .muted { color: var(--ink-5) !important; }

/* ============================================================
   THEME TOGGLE
   ============================================================ */
#theme-toggle { position: fixed; right: 22px; top: 0; z-index: 9999; width: 44px; height: 56px; display: inline-flex; align-items: center; justify-content: center; background: transparent; color: var(--ink-5); border: none; cursor: pointer; padding: 0; transition: color .15s; }
#theme-toggle:hover { color: var(--clay); }
#theme-toggle:focus-visible { outline: 2px solid var(--clay); outline-offset: 3px; border-radius: 4px; }
.ic-sun { display: block; }
.ic-moon { display: none; }
[data-theme="light"] .ic-sun { display: none; }
[data-theme="light"] .ic-moon { display: block; }

/* ============================================================
   SCROLL REVEAL
   ============================================================ */
.rv { opacity: 0; transform: translateY(20px); transition: opacity .65s ease, transform .65s ease; }
.rv.visible { opacity: 1; transform: none; }
.rv-d1 { transition-delay: .1s; }
.rv-d2 { transition-delay: .2s; }
.rv-d3 { transition-delay: .3s; }
.rv-d4 { transition-delay: .4s; }
@media (prefers-reduced-motion: reduce) {
  .rv { opacity: 1; transform: none; transition: none; }
}

/* ============================================================
   SHARED TYPE
   ============================================================ */
.sv-label { display: block; font-family: var(--mono); font-size: 11px; letter-spacing: 0.20em; text-transform: uppercase; color: var(--ink-5); margin-bottom: calc(var(--u) * 2); }

/* ============================================================
   BUTTONS
   ============================================================ */
.sv-btn { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 12px 28px; font-family: var(--mono); font-size: 11px; font-weight: 500; letter-spacing: 0.16em; text-transform: uppercase; border: 1px solid transparent; cursor: pointer; white-space: nowrap; }
.sv-btn:focus-visible { outline: 2px solid var(--clay); outline-offset: 3px; }
.sv-btn-solid { background: var(--clay); color: #fff; border-color: var(--clay); }
.sv-btn-solid:hover { background: transparent; color: var(--clay); border-color: var(--clay); }
.sv-btn-ghost { background: transparent; color: var(--ink); border-color: var(--ink); }
.sv-btn-ghost:hover { background: var(--ink); color: var(--paper); }

/* ============================================================
   IMAGE TREATMENT
   ============================================================ */
.sv-img img { width: 100%; height: 100%; object-fit: cover; filter: grayscale(35%) brightness(0.6) contrast(1.1); transition: filter .8s ease, transform .8s ease; display: block; }
.sv-img:hover img { filter: grayscale(10%) brightness(0.75) contrast(1.05); transform: scale(1.04); }

/* ============================================================
   HERO
   ============================================================ */
.sv-hero {
  position: relative;
  min-height: calc(100vh - var(--nav-h));
  display: flex; flex-direction: column; justify-content: space-between;
  padding: calc(var(--u) * 6) 0 0;
  overflow: hidden;
}
.sv-hero-bgimg { position: absolute; inset: 0; z-index: 0; overflow: hidden; }
.sv-hero-bgimg img {
  width: 100%; height: 100%; object-fit: cover;
  filter: grayscale(80%) brightness(0.18) contrast(1.1);
  transform: scale(1.04);
}
.sv-hero-bgnum {
  position: absolute; right: 5vw; bottom: -2vw; z-index: 1;
  font-family: var(--mono); font-weight: 500;
  font-size: clamp(200px, 30vw, 480px);
  line-height: 0.85; letter-spacing: -0.06em;
  color: var(--ink); opacity: 0.05;
  pointer-events: none; user-select: none;
}
.sv-hero-top {
  position: relative; z-index: 2;
  display: flex; justify-content: space-between; align-items: center;
  gap: 16px;
}
.sv-back {
  font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.16em; text-transform: uppercase;
  color: var(--ink-5); transition: color .2s;
  /* Accessible touch target */
  display: inline-flex; align-items: center; min-height: 44px; padding: 0 4px;
}
.sv-back:hover { color: var(--clay); }
.sv-back:focus-visible { outline: 2px solid var(--clay); outline-offset: 3px; }
.sv-eyebrow { font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-5); text-align: right; }
.sv-hero-main { position: relative; z-index: 2; padding: calc(var(--u) * 12) 0 calc(var(--u) * 8); }
.sv-headline {
  font-family: var(--sans); font-weight: 800;
  font-size: clamp(54px, 8.5vw, 124px);
  line-height: 1.0; letter-spacing: -0.04em;
  color: var(--ink); margin-bottom: calc(var(--u) * 4);
}
.sv-hero-sub { font-size: clamp(17px, 1.6vw, 22px); line-height: 1.5; color: var(--ink-3); max-width: 56ch; }
.sv-hero-foot {
  position: relative; z-index: 2;
  display: flex; align-items: center; gap: 16px;
  padding: calc(var(--u) * 4) 0 calc(var(--u) * 8);
  border-top: 1px solid var(--hair);
}
@media (max-width: 600px) { .sv-hero-foot { flex-direction: column; align-items: flex-start; } .sv-btn { width: 100%; } }

/* ============================================================
   STATS STRIP
   ============================================================ */
.sv-stats { border-top: 1px solid var(--hair); border-bottom: 1px solid var(--hair); background: var(--paper-2); }
.sv-stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); }
@media (max-width: 860px) { .sv-stats-grid { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 480px) { .sv-stats-grid { grid-template-columns: 1fr; } }
.sv-stat { padding: calc(var(--u) * 5) calc(var(--u) * 4); border-right: 1px solid var(--hair); }
.sv-stat:last-child { border-right: 0; }
@media (max-width: 860px) { .sv-stat:nth-child(2) { border-right: 0; } .sv-stat:nth-child(3) { border-right: 1px solid var(--hair); } }
@media (max-width: 480px) { .sv-stat { border-right: 0; border-bottom: 1px solid var(--hair); } .sv-stat:last-child { border-bottom: 0; } }
.sv-stat-n { font-family: var(--mono); font-size: clamp(22px, 2.5vw, 34px); font-weight: 500; color: var(--clay); letter-spacing: -0.02em; margin-bottom: 6px; }
.sv-stat-l { font-family: var(--mono); font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--ink-5); }

/* ============================================================
   ABOUT (edge-to-edge 2-col)
   ============================================================ */
.sv-about { display: grid; grid-template-columns: 7fr 5fr; min-height: 80vh; border-bottom: 1px solid var(--hair); }
@media (max-width: 860px) { .sv-about { grid-template-columns: 1fr; min-height: auto; } }
.sv-about-text-col { display: flex; align-items: center; }
.sv-about-inner {
  padding: calc(var(--u) * 14) 60px calc(var(--u) * 14) max(30px, calc((100vw - 1560px) / 2 + 30px));
  max-width: 680px;
}
@media (max-width: 860px) { .sv-about-inner { padding: calc(var(--u) * 10) 20px; max-width: none; } }
.sv-about-h2 { font-family: var(--sans); font-weight: 700; font-size: clamp(28px, 3.2vw, 48px); line-height: 1.08; letter-spacing: -0.032em; color: var(--ink); margin-bottom: calc(var(--u) * 4); }
.sv-about-p { font-size: 17px; line-height: 1.75; color: var(--ink-3); margin-bottom: calc(var(--u) * 5); }
.sv-about-bullets { display: grid; gap: calc(var(--u) * 2); }
.sv-about-bullets li { display: grid; grid-template-columns: 20px 1fr; gap: 14px; font-size: 15px; line-height: 1.55; color: var(--ink-3); }
.sv-about-bullets li::before { content: '-'; font-family: var(--mono); font-size: 12px; color: var(--clay); padding-top: 2px; }
.sv-about-img-col { position: relative; overflow: hidden; background: var(--paper-2); }
@media (max-width: 860px) { .sv-about-img-col { aspect-ratio: 4/3; min-height: 280px; } }
.sv-about-img-col img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: grayscale(30%) brightness(0.65) contrast(1.1); transition: transform 8s ease-out; }
.sv-about-img-col:hover img { transform: scale(1.05); }
.sv-about-img-tag { position: absolute; bottom: 24px; left: 24px; font-family: var(--mono); font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--ink); background: rgba(28,29,32,.82); backdrop-filter: blur(6px); padding: 7px 14px; border: 1px solid var(--hair); }

/* ============================================================
   DELIVERABLES
   ============================================================ */
.sv-delivers { padding: calc(var(--u) * 14) 0; border-bottom: 1px solid var(--hair); }
@media (max-width: 860px) { .sv-delivers { padding: calc(var(--u) * 10) 0; } }
.sv-sec-head { margin-bottom: calc(var(--u) * 7); }
.sv-sec-head h2 { font-family: var(--sans); font-weight: 700; font-size: clamp(24px, 2.8vw, 42px); line-height: 1.1; letter-spacing: -0.028em; }
.sv-dl-grid { display: grid; grid-template-columns: repeat(3, 1fr); border-left: 1px solid var(--hair); border-top: 1px solid var(--hair); }
@media (max-width: 860px) { .sv-dl-grid { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 520px) { .sv-dl-grid { grid-template-columns: 1fr; } }
.sv-dl-item { border-right: 1px solid var(--hair); border-bottom: 1px solid var(--hair); padding: calc(var(--u) * 4); display: grid; gap: calc(var(--u) * 2); transition: background .3s; }
.sv-dl-item:hover { background: var(--paper-2); }
.sv-dl-n { font-family: var(--mono); font-size: 11px; letter-spacing: 0.22em; color: var(--clay); }
.sv-dl-title { font-family: var(--sans); font-weight: 700; font-size: 15px; line-height: 1.3; color: var(--ink); }
.sv-dl-desc { font-size: 14px; line-height: 1.6; color: var(--ink-5); }

/* ============================================================
   GALLERY
   ============================================================ */
.sv-gallery { padding: calc(var(--u) * 14) 0; border-bottom: 1px solid var(--hair); }
@media (max-width: 860px) { .sv-gallery { padding: calc(var(--u) * 10) 0; } }
.sv-gallery-grid { display: grid; grid-template-columns: 8fr 4fr; grid-template-rows: 1fr 1fr; gap: 30px; height: 560px; }
@media (max-width: 1024px) { .sv-gallery-grid { height: 480px; } }
@media (max-width: 860px) { .sv-gallery-grid { grid-template-columns: 1fr 1fr; grid-template-rows: 240px 240px; height: auto; } }
@media (max-width: 520px) { .sv-gallery-grid { grid-template-columns: 1fr; grid-template-rows: 260px 220px 220px; } }
.sv-gallery-item { position: relative; overflow: hidden; background: var(--paper-2); }
.sv-gallery-item:first-child { grid-row: 1 / 3; }
@media (max-width: 520px) { .sv-gallery-item:first-child { grid-row: auto; } }
.sv-gallery-item img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: grayscale(35%) brightness(0.62) contrast(1.1); transition: filter .7s ease, transform 7s ease-out; }
.sv-gallery-item:hover img { filter: grayscale(10%) brightness(0.78) contrast(1.05); transform: scale(1.06); }
.sv-gallery-caption { position: absolute; bottom: 0; left: 0; right: 0; padding: 40px 20px 14px; background: linear-gradient(transparent, rgba(18,19,21,.88)); font-family: var(--mono); font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: rgba(234,231,221,.80); }
.sv-gallery-tag { position: absolute; top: 16px; left: 16px; font-family: var(--mono); font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; background: var(--clay); color: #fff; padding: 5px 10px; }

/* ============================================================
   PROCESS
   ============================================================ */
.sv-process { padding: calc(var(--u) * 14) 0; border-bottom: 1px solid var(--hair); }
@media (max-width: 860px) { .sv-process { padding: calc(var(--u) * 10) 0; } }

/* ----------------------------------------------------------------
   SCROLL REVEALS
---------------------------------------------------------------- */
const obs = new IntersectionObserver(entries => {
  entries.forEach(e => {
    if (e.isIntersecting) { e.target.classList.add('visible'); obs.unobserve(e.target); }
  });
}, { threshold: 0.08 });
document.querySelectorAll('.rv').forEach(el => obs.observe(el));

/* ----------------------------------------------------------------
   FAQ ACCORDION  — aria-expanded toggled on every open/close
---------------------------------------------------------------- */
document.querySelectorAll('.sv-faq-q').forEach(btn => {
  btn.addEventListener('click', () => {
    const row    = btn.parentElement;
    const isOpen = row.classList.contains('open');

    /* close all */
    document.querySelectorAll('.sv-faq-row.open').forEach(r => {
      r.classList.remove('open');
      r.querySelector('.sv-faq-q').setAttribute('aria-expanded', 'false');
    });

    /* open clicked (if it was closed) */
    if (!isOpen) {
      row.classList.add('open');
      btn.setAttribute('aria-expanded', 'true');
    }
  });
});

/* ----------------------------------------------------------------
   THEME TOGGLE
---------------------------------------------------------------- */
const toggle = document.getElementById('theme-toggle');
if (toggle) {
  const root  = document.documentElement;
  const saved = localStorage.getItem('ff_theme') || 'dark';
  root.setAttribute('data-theme', saved);
  toggle.addEventListener('click', () => {
    const next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    localStorage.setItem('ff_theme', next);
  });
}
