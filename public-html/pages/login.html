<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Sign in · Fashion Freelancing</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media=&apos;all&apos;" />
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" /></noscript>
<link rel="stylesheet" href="../assets/styles.css" />
<style>
  .oauth { display:flex; align-items:center; justify-content:center; gap:10px; border:1px solid var(--line); background:#fff; padding:11px; border-radius:10px; font-size:14px; font-weight:500; transition: all .15s; }
  .oauth:hover { border-color:var(--ink); background: var(--paper); }
  .or-divider { display:flex; align-items:center; gap:12px; color: var(--ink-5); font-size:12px; margin: 18px 0; }
  .or-divider::before, .or-divider::after { content:""; flex:1; height:1px; background: var(--line); }
</style>
</head>
<body>

<div class="auth-split">
  <div class="auth-pane fx-stage">
    <span class="fx-orb v md" style="top:-180px;left:-160px;"></span>
    <span class="fx-orb c sm" style="bottom:-140px;left:20%;animation-delay:-9s;"></span>
    <a href="../index.html" class="logo"><span class="logo-mark">F</span><span class="logo-text">Fashion<span>Freelancing</span></span></a>

    <div style="flex:1;display:flex;align-items:center;">
      <div style="width:100%;max-width:400px;margin:0 auto;">
        <h1 class="h-1" style="font-size: 38px;">Welcome back.</h1>
        <p class="lead mt-3">Sign in to keep going.</p>

        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:32px;">
          <a href="./dashboard-router.html" class="oauth">
            <svg width="16" height="16" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.6 12.2c0-.7-.1-1.4-.2-2H12v3.9h6c-.3 1.4-1.1 2.5-2.3 3.3v2.7h3.7c2.2-2 3.4-5 3.4-7.9z"/><path fill="#34A853" d="M12 23c3.1 0 5.7-1 7.6-2.8l-3.7-2.8c-1 .7-2.4 1.1-3.9 1.1-3 0-5.5-2-6.4-4.7H1.7v3C3.6 20.6 7.5 23 12 23z"/><path fill="#FBBC05" d="M5.6 13.7c-.2-.7-.4-1.4-.4-2.2s.1-1.5.4-2.2v-3H1.7C.9 7.9.5 9.4.5 11s.4 3.1 1.2 4.7l3.9-3z"/><path fill="#EA4335" d="M12 4.7c1.7 0 3.2.6 4.4 1.7l3.3-3.3C17.7 1.3 15.1.5 12 .5 7.5.5 3.6 2.9 1.7 6.5l3.9 3C6.5 6.7 9 4.7 12 4.7z"/></svg>
            Continue with Google
          </a>
          <a href="./dashboard-router.html" class="oauth">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M17.5 12.5c0-2.6 2.1-3.9 2.2-4-1.2-1.7-3-2-3.7-2-1.6-.2-3 .9-3.8.9-.8 0-2-.9-3.3-.9-1.7 0-3.3 1-4.2 2.5-1.8 3.1-.5 7.7 1.3 10.2.9 1.2 1.9 2.6 3.2 2.6 1.3-.1 1.8-.8 3.3-.8s2 .8 3.3.8c1.4 0 2.3-1.3 3.1-2.5.6-.9 1.2-1.9 1.6-3-1.7-.7-2.9-2.4-3-4.4zM14.7 4.6c.7-.8 1.1-2 1-3.1-.9 0-2 .6-2.7 1.4-.6.7-1.2 1.9-1 3 1 .1 2-.5 2.7-1.3z"/></svg>
            Continue with Apple
          </a>
        </div>

        <div class="or-divider">or use your email</div>

        <form id="ff-login-form" style="display:flex;flex-direction:column;gap:14px;">
          <div><label class="label">Email</label><input class="input" type="email" placeholder="you@email.com" autocomplete="email" required/></div>
          <div>
            <div style="display:flex;justify-content:space-between;align-items:center;">
              <label class="label">Password</label>
              <a href="./forgot-password.html" style="font-size:12px;color:var(--ink-5);">Forgot?</a>
            </div>
            <input class="input" type="password" placeholder="••••••••" autocomplete="current-password" required/>
          </div>
          <label style="display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-3);cursor:pointer;">
            <input type="checkbox" style="accent-color:var(--ink);"/> Send me a magic link instead
          </label>
          <button class="btn btn-primary btn-lg w-full" type="submit">Sign in</button>
        </form>

        <p class="text-sm muted text-center mt-6">
          New here? <a href="./signup.html" class="ulink" style="color:var(--ink);">Create an account →</a>
        </p>
      </div>
    </div>

    <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--ink-5);">
      <span>© 2026 Fashion Freelancing</span>
      <div style="display:flex;gap:16px;"><a href="./privacy.html">Privacy</a><a href="./terms.html">Terms</a></div>
    </div>
  </div>

  <div class="auth-side">
    <img src="https://images.unsplash.com/photo-1529339944388-c71d604e30bc?w=1400&auto=format&fit=crop" alt=""/>
    <div style="position:absolute;inset:0;background:linear-gradient(135deg,rgba(0,0,0,.5),transparent 60%);"></div>
    <div style="position:absolute;bottom:32px;left:32px;right:32px;color:#fff;">
      <div style="font-family:var(--font-display);font-size:32px;font-weight:480;line-height:1.15;max-width:420px;letter-spacing:-0.02em;">"Hired three freelancers in a week. Way easier than I expected."</div>
      <div style="font-size:13px;opacity:.85;margin-top:14px;font-family:var(--font-display);font-style:italic;">— Sara · Auriga · Stockholm</div>
    </div>
  </div>
</div>

<script src="../assets/site.js"></script>
<script>
  // Wait for shared modules
  window.onFFReady(() => {
    const form = document.getElementById('ff-login-form');
    if (!form) return;
    const emailInput = form.querySelector('input[type="email"]');
    const submitBtn = form.querySelector('button[type="submit"]');

    // Where to go after sign-in: ?next= takes priority, else the right workspace.
    function destinationFor(session) {
      const next = new URLSearchParams(location.search).get('next');
      if (next && next.startsWith('/') || (next && next.startsWith('./'))) return next;
      const role = session && session.role;
      if (role === 'brand') return '/brand';
      if (role === 'admin') return '/admin';
      return '/dashboard'; // creator / freelancer
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = emailInput.value.trim();
      if (!email) return;
      submitBtn.disabled = true;
      submitBtn.textContent = 'Signing in…';
      try {
        const session = await api.users.signIn({ email });
        UI.toast(`Welcome back, ${session.name.split(' ')[0]}.`, { kind: 'success' });
        const dest = destinationFor(session);
        setTimeout(() => { window.location = dest; }, 500);
      } catch (err) {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Sign in';
        UI.toast(err.message || 'Could not sign in', { kind: 'error' });
      }
    });
  });
</script>

</body>
</html>
