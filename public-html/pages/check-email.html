<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Check your email · Fashion Freelancing</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media=&apos;all&apos;" />
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" /></noscript>
<link rel="stylesheet" href="../assets/styles.css" />
<style>body { background: var(--paper); display:flex; align-items:center; justify-content:center; min-height:100vh; }</style>
</head>
<body>

<div style="width:100%;max-width:480px;padding:32px;text-align:center;">
  <a href="../index.html" class="logo" style="display:inline-flex;margin-bottom:32px;"><span class="logo-mark">F</span><span class="logo-text">Fashion<span>Freelancing</span></span></a>

  <div class="card card-pad-lg">
    <div style="width:64px;height:64px;border-radius:99px;background:var(--champagne-50);color:var(--champagne-2);display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--champagne-100);margin-bottom:20px;">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>
    </div>
    <h1 class="h-1" style="font-size:32px;">Check your email.</h1>
    <p class="lead mt-3">We sent a sign-in link to<br/><strong style="color:var(--ink);">you@studio.com</strong></p>

    <div style="margin-top:24px;padding:14px;background:var(--paper);border-radius:10px;border:1px solid var(--line);font-size:13px;color:var(--ink-3);text-align:left;">
      <strong style="color:var(--ink);">Tip:</strong> The email might land in promotions or spam. The link expires in 15 minutes.
    </div>

    <div style="margin-top:24px;display:flex;flex-direction:column;gap:8px;">
      <a href="./login.html" class="btn btn-ghost w-full">← Back to sign in</a>
      <button class="btn btn-link" style="font-size:13px;color:var(--ink-5);">Didn't get it? Resend in <span class="tabular">42s</span></button>
    </div>
  </div>

  <p class="text-xs muted mt-6">Wrong email? <a href="./forgot-password.html" class="ulink" style="color:var(--ink);">Try again →</a></p>
</div>

<script src="../assets/site.js"></script>
</body>
</html>
