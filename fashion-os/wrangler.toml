# These are the LIVE bindings: the database_id below is the production D1
# database, and anything run with `--remote` changes real data (see DEPLOY.md).
# Development runs on local files under .wrangler/state — `--local`, the default
# for `npm run dev` and `npm run db:migrate:local`.
#
# @astrojs/cloudflare v14 builds a WORKER with static assets, not a Pages
# project. `astro build` merges this file into dist/server/wrangler.json, which
# is the config wrangler runs and deploys:
#
#   npm run preview   -> wrangler dev    --config dist/server/wrangler.json
#   npm run deploy    -> wrangler deploy --config dist/server/wrangler.json
#
# Do not add `pages_build_output_dir` — it makes wrangler treat this as a Pages
# project, and Pages rejects the adapter's reserved ASSETS binding.
name = "fashion-freelancing"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

# Variables set in the Cloudflare dashboard (MAIL_FROM, LEADS_TO, …) survive a
# deploy. Without this, every push would reset the worker's variables to the
# [vars] below and silently switch outbound mail off.
keep_vars = true

# Workers Logs: console output and uncaught errors from every request, kept
# and searchable in the dashboard (Workers → fashion-freelancing → Logs).
[observability]
enabled = true
head_sampling_rate = 1

# --- Relational database: every table in the plan's core data areas (§11) ---
[[d1_databases]]
binding = "DB"
database_name = "fashion_os"
database_id = "9a5af7a9-a3c2-4a16-95f2-f1cfba149d37"
migrations_dir = "migrations"

# --- Object storage: portfolio pieces and project attachments ---
# Enabled on the new account (R2 subscription added 2026-09-09). The app offers
# a file field only when this binding exists — see src/server/storage.ts —
# and every read back through /api/files re-checks authorization.
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "fashion-os-media"

# No KV. Astro's session store is disabled in astro.config.mjs, and our own
# sign-in sessions live in D1, so nothing needs a KV namespace.

# --- Outbound email: Cloudflare Email Service, on this account ---
# No outside provider. Onboard the domain once (Compute → Email Service →
# Email Sending → Onboard Domain); its records live on cf-bounce., so the
# Hostinger inbox records are untouched. Mail sends once MAIL_FROM is set below.
# Deliberately not `remote = true`: a local `npm run dev` must never send real
# mail from the live account to whatever test address someone types.
[[send_email]]
name = "EMAIL"

[vars]
SITE_URL = "https://fashionfreelancing.com"
# Outbound mail (src/server/mail.ts). Remove MAIL_FROM to stop sending and
# keep every message queued in outbound_email instead.
MAIL_FROM = "Fashion Freelancing <no-reply@fashionfreelancing.com>"
MAIL_REPLY_TO = "hello@fashionfreelancing.com"   # where replies to our mail go
LEADS_TO = "hello@fashionfreelancing.com"        # every new enquiry, comma-separated
# Google sign-in (src/server/google.ts). The client id is public; the secret is
# GOOGLE_CLIENT_SECRET, set with `wrangler secret put`. The button shows once both exist.
GOOGLE_CLIENT_ID = "319914784956-uv1hj4crtqggutrpafpkpqef76piqu6c.apps.googleusercontent.com"

# Per-visitor demo sandboxes (src/server/tenant.ts). Leave UNSET for the live
# site, which is one shared workspace. "1" gives every browser its own private
# copy of the product, and an account made that way exists only in the browser
# that made it — fine for a review build, never for real users.
# DEMO_SANDBOX = "1"

# Secrets — set with `wrangler secret put <NAME>` (or in the dashboard), never
# committed:
#   GOOGLE_CLIENT_SECRET      Google sign-in
#
# There is no session secret. A session is a random token in an HttpOnly
# cookie whose SHA-256 is looked up in D1 (src/server/session.ts) — nothing is
# signed, so there is no key to set or rotate. Revoking a session is deleting
# its row.
