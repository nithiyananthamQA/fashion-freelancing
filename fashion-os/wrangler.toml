# NOTHING HERE IS PROVISIONED. Every id below is a placeholder, so no command
# in this repo can touch a real Cloudflare account by accident. Development runs
# entirely on local files under .wrangler/state — no cloud, no billing.
#
# @astrojs/cloudflare v14 builds a WORKER with static assets, not a Pages
# project. `astro build` merges this file into dist/server/wrangler.json, which
# is the config wrangler runs and deploys:
#
#   npm run preview   -> wrangler dev    --config dist/server/wrangler.json
#   npm run deploy    -> wrangler deploy --config dist/server/wrangler.json
#
# Do not add `pages_build_output_dir` — it makes wrangler treat this as a Pages
# project, and Pages rejects the adapter's reserved ASSETS binding.
name = "fashion-freelancing"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

# --- Relational database: every table in the plan's core data areas (§11) ---
[[d1_databases]]
binding = "DB"
database_name = "fashion_os"
database_id = "9a5af7a9-a3c2-4a16-95f2-f1cfba149d37"
migrations_dir = "migrations"

# --- Object storage: portfolio pieces and project attachments ---
# Enabled on the new account (R2 subscription added 2026-09-09). The app offers
# a file field only when this binding exists — see src/server/storage.ts —
# and every read back through /api/files re-checks authorization.
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "fashion-os-media"

# No KV. Astro's session store is disabled in astro.config.mjs, and our own
# sign-in sessions live in D1, so nothing needs a KV namespace.

[vars]
SITE_URL = "https://fashion-freelancing.freelancingfashion.workers.dev"   # domain not connected yet; switch back when it is
# Outbound mail: leave unset to queue verification / notification mail in the
# outbound_email table instead of sending it (see src/server/mail.ts).
# MAIL_FROM = "no-reply@fashionfreelancing.com"

# Secrets — set with `wrangler pages secret put <NAME>`, never committed:
#   SESSION_SECRET   required, signs session cookies
#   RESEND_API_KEY   optional, enables real outbound email
